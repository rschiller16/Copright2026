<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       
    <nav>
        <div class="logo"></div>
    </nav>

    <div class="container">

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

    </div>

 <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: white;
            border-bottom: 2px solid black;
            z-index: 0;
        }

        .logo {
            position: absolute;
            right: 0;
            top: 0;
            width: 80px;
            height: 80px;
            background-color: black;
            z-index: 1;
        }

        .container {
            height: 800px;
            background-color: grey;
            margin-top: 80px;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: white;
            margin: 20px;
            display: inline-block;
        }

        footer {
            width: 100%;
            height: 80px;
            background-color: white;
            border-top: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer h1 {
            margin: 0;
        }

    </style>
</head>

<body>
    <
    <footer>
        <h1>Copyright 2026</h1>
    </footer>

</body>
</html>
